name: CI

# La suite del backend levanta su propio servidor en memoria (ver
# backend/tests/run.mjs), así que no necesita ninguna base de datos ni
# secreto configurado aparte — corre igual aquí que en una máquina local.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Ejecutar la suite
        working-directory: backend
        run: npm test

  frontend-build:
    name: Compilar el frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Ejecutar los tests
        working-directory: frontend
        run: npm test

      - name: Compilar
        working-directory: frontend
        run: npm run build
